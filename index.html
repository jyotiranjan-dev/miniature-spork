<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>JS Notes</title>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f4f3ef;
            --panel: #faf9f6;
            --line: #d9d7cf;
            --ink: #1a1a1a;
            --mute: #76736b;
            --ghost: #e2e0d8;
            --pat: rgba(26, 26, 26, .2);
            --acc: #c6613f;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #161616;
                --panel: #1a1a1a;
                --line: #2c2c2c;
                --ink: #f3f3f3;
                --mute: #8b8b8b;
                --ghost: #2a2a2a;
                --pat: rgba(255, 255, 255, .22);
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #161616;
            --panel: #1a1a1a;
            --line: #2c2c2c;
            --ink: #f3f3f3;
            --mute: #8b8b8b;
            --ghost: #2a2a2a;
            --pat: rgba(255, 255, 255, .22);
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 .8rem/1.5 "IBM Plex Mono", ui-monospace, Menlo, monospace;
            overflow-x: hidden
        }

        button,
        select,
        input {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        :focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        header {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--line);
            padding: 26px clamp(14px, 3vw, 28px) 22px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start
        }

        .ghost {
            position: absolute;
            left: 46%;
            top: 50%;
            transform: translateY(-50%);
            font: 700 clamp(3rem, 11vw, 6.5rem)/1 "Work Sans", sans-serif;
            letter-spacing: .2em;
            color: transparent;
            -webkit-text-stroke: 1.5px var(--ghost);
            pointer-events: none;
            white-space: nowrap
        }

        .hd {
            position: relative;
            min-width: 0
        }

        .eyebrow {
            font-size: .65rem;
            letter-spacing: .18em;
            color: var(--mute)
        }

        h1 {
            margin: 6px 0 4px;
            font: 700 clamp(1.3rem, 3.6vw, 1.8rem)/1 "Work Sans", sans-serif;
            letter-spacing: .2em
        }

        .sub {
            color: var(--mute);
            margin: 0;
            font-size: .75rem
        }

        .theme {
            position: relative;
            display: flex;
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 2px;
            gap: 2px;
            flex: none
        }

        .theme button {
            background: none;
            border: 1px solid transparent;
            font-size: .62rem;
            letter-spacing: .1em;
            padding: 4px 8px;
            color: var(--mute)
        }

        .theme button.on {
            border-color: var(--ink);
            color: var(--ink)
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            justify-content: space-between;
            padding: 18px clamp(14px, 3vw, 28px) 0
        }

        .f label {
            display: block;
            font-size: .62rem;
            letter-spacing: .18em;
            color: var(--mute);
            margin-bottom: 5px
        }

        .sbox {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 0 10px;
            width: min(320px, 100%)
        }

        .sbox:focus-within {
            border-color: var(--acc)
        }

        .sbox input {
            flex: 1;
            min-width: 0;
            background: none;
            border: 0;
            padding: 8px 0;
            outline: none
        }

        .sbox svg {
            color: var(--mute);
            flex: none
        }

        .right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end
        }

        select {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 7px 8px;
            min-width: 116px;
            max-width: 100%
        }

        .add {
            background: var(--acc);
            border: 0;
            color: #fff;
            padding: 8px 14px;
            letter-spacing: .05em;
            font-weight: 500;
            white-space: nowrap
        }

        .count {
            padding: 16px clamp(14px, 3vw, 28px) 10px;
            font-size: .65rem;
            letter-spacing: .18em;
            color: var(--mute)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            border-top: 1px solid var(--line);
            border-left: 1px solid var(--line);
            margin: 0 clamp(14px, 3vw, 28px) 48px
        }

        .cell {
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            min-width: 0
        }

        .pv {
            display: grid;
            place-items: center;
            height: clamp(96px, 12vw, 124px);
            text-decoration: none;
            color: inherit
        }

        .pv span {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            background: var(--bg);
            border: 1px solid var(--line);
            font-size: 1.4rem;
            transition: transform .2s, border-color .2s
        }

        .pv:hover span {
            transform: scale(1.08);
            border-color: var(--acc)
        }

        .info {
            padding: 11px 12px 0
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px
        }

        .nm {
            font: 600 .88rem "Work Sans", sans-serif;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .nm small {
            font: 400 .65rem "IBM Plex Mono", monospace;
            color: var(--mute);
            margin-right: 6px
        }

        .tag {
            font-size: .58rem;
            letter-spacing: .12em;
            color: var(--mute);
            text-transform: uppercase;
            white-space: nowrap
        }

        .d {
            color: var(--mute);
            font-size: .72rem;
            margin: 4px 0 10px;
            min-height: 1.1em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .act {
            display: flex;
            gap: 12px;
            align-items: center;
            border-top: 1px solid var(--line);
            padding: 8px 12px;
            font-size: .72rem;
            flex-wrap: wrap
        }

        .act a,
        .act button {
            background: none;
            border: 0;
            padding: 0;
            color: var(--mute);
            text-decoration: none
        }

        .act a {
            color: var(--ink)
        }

        .act a:hover,
        .act button:hover {
            color: var(--acc)
        }

        .act .rm {
            margin-left: auto
        }

        .act .rm.arm {
            color: #e5484d;
            font-weight: 500
        }

        .empty {
            padding: 36px 14px;
            color: var(--mute);
            grid-column: 1/-1
        }

        .empty button {
            background: none;
            border: 0;
            color: var(--acc);
            text-decoration: underline;
            padding: 0
        }

        dialog {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            padding: 20px;
            width: min(400px, 92vw)
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, .55)
        }

        dialog h2 {
            margin: 0 0 14px;
            font: 700 .95rem "Work Sans", sans-serif;
            letter-spacing: .14em
        }

        dialog input {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 9px 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            outline: none
        }

        dialog input:focus {
            border-color: var(--acc)
        }

        .row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 4px
        }

        .row button {
            border: 1px solid var(--line);
            background: none;
            padding: 8px 14px
        }

        .row .ok {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 18px clamp(14px, 3vw, 28px) 26px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            align-items: center;
            justify-content: space-between;
            color: var(--mute);
            font-size: .72rem;
            letter-spacing: .06em
        }

        footer nav {
            display: flex;
            gap: 16px
        }

        footer a {
            color: var(--ink);
            text-decoration: none;
            border-bottom: 1px solid var(--line)
        }

        footer a:hover {
            color: var(--acc);
            border-color: var(--acc)
        }

        @media (max-width:640px) {
            .ghost {
                display: none
            }

            .bar {
                flex-direction: column;
                align-items: stretch
            }

            .sbox {
                width: 100%
            }

            .right {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px
            }

            .right .f:last-of-type {
                grid-column: auto
            }

            .add {
                grid-column: 1/-1
            }

            select {
                width: 100%
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr))
            }

            .pv {
                height: 90px
            }
        }

        @media (max-width:380px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="ghost" aria-hidden="true">NOTES</div>
        <div class="hd">
            <div class="eyebrow">PERSONAL NOTES HUB</div>
            <h1>JS NOTES</h1>
            <p class="sub">All my Notion notes, one tap away.</p>
        </div>
        <div class="theme" id="theme"><button data-t="system">AUTO</button><button data-t="dark">DARK</button><button
                data-t="light">LIGHT</button></div>
    </header>
    <div class="bar">
        <div class="f"><label for="q">SEARCH</label>
            <div class="sbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg><input id="q" placeholder="name or tag…" autocomplete="off"></div>
        </div>
        <div class="right">
            <div class="f"><label for="cat">CATEGORY</label><select id="cat"></select></div>
            <div class="f"><label for="sort">SORT</label><select id="sort">
                    <option value="cat">Category</option>
                    <option value="name">Name</option>
                    <option value="new">Newest</option>
                </select></div>
            <button class="add" id="add">+ ADD NOTE</button>
        </div>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <footer><span>MADE BY <b style="color:var(--ink)">ᴊʏᴏᴛɪʀᴀɴᴊᴀɴ.....ᐟ</b></span>
        <nav><a href="https://instagram.com/caliisilio" target="_blank" rel="noopener">Instagram</a><a
                href="https://t.me/caliisilio" target="_blank" rel="noopener">Telegram</a></nav>
    </footer>

    <dialog id="dlg">
        <h2 id="dt">ADD A NOTE</h2>
        <input id="f-title" placeholder="Title">
        <input id="f-url" placeholder="Link (https://…)" inputmode="url">
        <input id="f-cat" placeholder="Category, for example Study">
        <input id="f-emoji" placeholder="Emoji, for example 📘" maxlength="2">
        <input id="f-desc" placeholder="One line about it (optional)">
        <div class="row"><button id="cancel">Cancel</button><button class="ok" id="save">Save note</button></div>
    </dialog>

    <script>
        const DEFAULTS = [{ title: "Main notes", url: "https://notes-by-js.notion.site/ebd/40651af1748980e286a0f2ff52905e33", cat: "General", emoji: "📓", desc: "Everything starts here.", t: 1 }, { title: "Internal", url: "https://notes-by-js.notion.site/ebd/40b51af1748980bca83df0571930ff24", cat: "Internal", emoji: "🔒", desc: "Internal notes.", t: 2 }];
        const KEY = "js-notes-v5", P = [
            "repeating-linear-gradient(45deg,var(--pat) 0 1px,transparent 1px 8px),repeating-linear-gradient(-45deg,var(--pat) 0 1px,transparent 1px 8px)",
            "linear-gradient(var(--pat) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--pat) 1px,transparent 1px) 0 0/22px 22px",
            "radial-gradient(var(--pat) 1.2px,transparent 1.5px) 0 0/18px 18px",
            "repeating-linear-gradient(0deg,var(--pat) 0 1px,transparent 1px 20px)",
            "repeating-linear-gradient(135deg,var(--pat) 0 2px,transparent 2px 11px)"];
        let notes = DEFAULTS.slice(), shown = [], ed = null;
        try { const s = localStorage.getItem(KEY); if (s) notes = JSON.parse(s) } catch (e) { }
        const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)) } catch (e) { } };
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        function render() {
            const q = $("q").value.trim().toLowerCase(), cats = [...new Set(notes.map(n => n.cat).filter(Boolean))].sort(), cur = $("cat").value || "All";
            $("cat").innerHTML = ["All", ...cats].map(c => `<option ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("");
            const c = $("cat").value, s = $("sort").value;
            shown = notes.map((n, i) => ({ ...n, i })).filter(n => (c === "All" || n.cat === c) && (n.title + " " + (n.desc || "") + " " + (n.cat || "")).toLowerCase().includes(q));
            shown.sort((a, b) => s === "name" ? a.title.localeCompare(b.title) : s === "new" ? (b.t || 0) - (a.t || 0) : (a.cat || "").localeCompare(b.cat || "") || a.title.localeCompare(b.title));
            $("count").textContent = shown.length + (shown.length === 1 ? " NOTE" : " NOTES");
            $("grid").innerHTML = shown.length ? shown.map((n, k) => `<article class="cell"><a class="pv" href="${esc(n.url)}" target="_blank" rel="noopener" style="background:${P[n.i % 5]}" aria-label="Open ${esc(n.title)}"><span>${esc(n.emoji || "📄")}</span></a>
  <div class="info"><div class="top"><div class="nm" title="${esc(n.title)}"><small>${String(k + 1).padStart(3, "0")}</small>${esc(n.title)}</div><div class="tag">${esc(n.cat || "")}</div></div><div class="d">${esc(n.desc || "")}</div></div>
  <div class="act"><a href="${esc(n.url)}" target="_blank" rel="noopener">Open</a><button data-c="${n.i}">Copy link</button><button data-e="${n.i}">Edit</button><button class="rm" data-r="${n.i}">Remove</button></div></article>`).join("") : `<div class="empty">No note matches “${esc(q)}”. <button id="again">Add it as a new note</button></div>`;
        }
        function copy(t) {
            const fb = () => { const a = document.createElement("textarea"); a.value = t; a.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy") } catch (e) { } a.remove() };
            try { navigator.clipboard.writeText(t).catch(fb) } catch (e) { fb() }
        }
        ["input", "change"].forEach(ev => ["q", "cat", "sort"].forEach(id => $(id).addEventListener(ev, render)));
        $("q").onkeydown = e => { if (e.key === "Enter") { const a = document.querySelector(".pv"); if (a) a.click() } };
        document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus() } });
        $("grid").onclick = e => {
            const c = e.target.closest("[data-c]"), r = e.target.closest("[data-r]"), ee = e.target.closest("[data-e]");
            if (c) { copy(notes[+c.dataset.c].url); c.textContent = "Copied ✓"; setTimeout(() => { c.textContent = "Copy link" }, 1400) }
            else if (ee) openDlg(+ee.dataset.e);
            else if (r) { if (r.classList.contains("arm")) { notes.splice(+r.dataset.r, 1); save(); render() } else { r.classList.add("arm"); r.textContent = "Tap to confirm"; setTimeout(() => { r.classList.remove("arm"); r.textContent = "Remove" }, 2500) } }
            else if (e.target.id === "again") openDlg();
        };
        function openDlg(i) {
            ed = Number.isInteger(i) ? i : null; const n = ed !== null ? notes[ed] : { title: $("q").value.trim() };
            $("dt").textContent = ed !== null ? "EDIT NOTE" : "ADD A NOTE";
            $("f-title").value = n.title || ""; $("f-url").value = n.url || ""; $("f-cat").value = n.cat || ""; $("f-emoji").value = n.emoji || ""; $("f-desc").value = n.desc || "";
            $("f-url").placeholder = "Link (https://…)"; $("dlg").showModal();
        }
        $("add").onclick = () => openDlg(); $("cancel").onclick = () => $("dlg").close();
        $("save").onclick = () => {
            const t = $("f-title").value.trim(), u = $("f-url").value.trim();
            if (!t || !/^https?:\/\//.test(u)) { $("f-url").value = ""; $("f-url").placeholder = "Need a title and a link starting with https://"; return }
            const o = { title: t, url: u, cat: $("f-cat").value.trim() || "General", emoji: $("f-emoji").value.trim(), desc: $("f-desc").value.trim() };
            if (ed !== null) Object.assign(notes[ed], o); else { o.t = Date.now(); notes.unshift(o); $("q").value = "" }
            save(); $("dlg").close(); render();
        };
        function theme(t) { const r = document.documentElement; t === "system" ? r.removeAttribute("data-theme") : r.dataset.theme = t;[...$("theme").children].forEach(b => b.classList.toggle("on", b.dataset.t === t)); try { localStorage.setItem("js-theme", t) } catch (e) { } }
        $("theme").onclick = e => { const b = e.target.closest("button"); if (b) theme(b.dataset.t) };
        let th = "system"; try { th = localStorage.getItem("js-theme") || "system" } catch (e) { }
        theme(th); render();
    </script>
</body>

</html>
