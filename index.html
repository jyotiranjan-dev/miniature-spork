
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090f">

    <title>My Notes | Study Space</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #09090f;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #7055ff;
            filter: blur(180px);
            opacity: 0.18;
            top: -200px;
            left: -150px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: #00bcd4;
            filter: blur(180px);
            opacity: 0.12;
            bottom: -200px;
            right: -100px;
            pointer-events: none;
        }

        /* Main Layout */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: auto;
            padding: 30px 40px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(135deg, #8065ff, #4930c9);
            display: grid;
            place-items: center;
            font-size: 21px;
            box-shadow: 0 5px 25px #7055ff55;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-name span {
            color: #9986ff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            background: #ffffff08;
            border: 1px solid #ffffff12;
            border-radius: 30px;
            color: #aaa;
            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #48d597;
            border-radius: 50%;
        }

        /* Hero */
        .hero {
            margin: 35px 0 28px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a696ff;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.15;
        }

        .hero h1 span {
            background: linear-gradient(90deg, #a995ff, #69d9ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            color: #888895;
            font-size: 14px;
            line-height: 1.7;
            margin-top: 14px;
            max-width: 500px;
        }

        /* Notes Card */
        .notes-card {
            margin-top: 30px;
            background: #ffffff08;
            border: 1px solid #ffffff16;
            border-radius: 18px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px #00000055;
        }

        .card-header {
            min-height: 65px;
            padding: 15px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #ffffff12;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 13px;
            font-weight: 600;
        }

        .notion-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #fff;
            color: #111;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 17px;
        }

        .open-btn {
            text-decoration: none;
            color: #fff;
            background: #ffffff12;
            border: 1px solid #ffffff20;
            border-radius: 9px;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: 600;
            transition: 0.25s;
        }

        .open-btn:hover {
            background: #8065ff;
            border-color: #8065ff;
            transform: translateY(-2px);
        }

        /* Iframe */
        .iframe-container {
            width: 100%;
            height: 78vh;
            min-height: 500px;
            background: #fff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Footer */
        .footer {
            padding: 24px 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            color: #686875;
            font-size: 11px;
        }

        .footer span {
            color: #9a89ff;
        }

        /* Mobile */
        @media (max-width: 650px) {
            .container {
                padding: 20px 15px;
            }

            .navbar {
                padding-bottom: 20px;
            }

            .hero {
                margin-top: 25px;
            }

            .hero h1 {
                letter-spacing: -1.5px;
            }

            .hero p {
                font-size: 13px;
            }

            .status {
                font-size: 0;
                padding: 11px;
            }

            .card-header {
                padding: 12px;
            }

            .iframe-container {
                height: 76vh;
                min-height: 450px;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Navbar -->
        <nav class="navbar">
            <div class="brand">
                <div class="logo">✦</div>
                <div class="brand-name">MY<span>SPACE.</span></div>
            </div>

            <div class="nav-right">
                <div class="status">
                    <span class="status-dot"></span>
                    Your personal workspace
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero">
            <div class="eyebrow">
                ✧ YOUR DIGITAL WORKSPACE
            </div>

            <h1>
                Your thoughts.<br>
                Your <span>knowledge.</span>
            </h1>

            <p>
                A dedicated space for your notes, ideas and learning.
                Everything organized in one place, ready whenever you need it.
            </p>
        </section>

        <!-- Notes Section -->
        <section class="notes-card">

            <div class="card-header">

                <div class="card-title">
                    <div class="notion-icon">N</div>
                    <div>
                        My Notion Notes
                    </div>
                </div>

                <a
                    class="open-btn"
                    href="https://notes-by-js.notion.site/ebd//40b51af1748980bca83df0571930ff24"
                    target="_blank"
                    rel="noopener noreferrer">
                    Open in Notion ↗
                </a>

            </div>

            <div class="iframe-container">
                <iframe
                    src="https://notes-by-js.notion.site/ebd//40b51af1748980bca83df0571930ff24"
                    title="My Notion Notes"
                    allowfullscreen>
                </iframe>
            </div>

        </section>

        <!-- Footer -->
        <footer class="footer">
            <div>Made with <span>♥</span> for better learning.</div>
            <div>MYSPACE © 2026</div>
        </footer>

    </div>

</body>
</html>
